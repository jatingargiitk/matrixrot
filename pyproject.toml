[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixrot"
version = "0.1.0"
description = "Find setup-python versions in GitHub Actions workflows that can't install on the runner they target."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jatin Garg"}]
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]
keywords = ["github-actions", "setup-python", "ci", "lint", "workflow"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/jatingargiitk/matrixrot"

[project.scripts]
matrixrot = "matrixrot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrixrot = ["data/*.json"]
